apiVersion: v1
kind: Service
metadata:
  name: finsecure-pay-service
  namespace: finsecure
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: finsecure-pay
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
